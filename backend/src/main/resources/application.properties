spring.config.import=optional:file:.env[.properties]

spring.application.name=backend
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration
spring.flyway.enabled=false
spring.liquibase.enabled=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://easyschedule2.netlify.app}

spring.output.ansi.enabled=ALWAYS
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %highlight(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:%wEx}
logging.file.name=logs/easyschedule.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.level.com.easyschedule.backend=INFO

app.google.client-id=${GOOGLE_CLIENT_ID:}




# SonarQube (analisis estatico local)
# Nota: el analizador (sonar-scanner) NO lee estos valores desde application.properties;
# la configuracion que se ejecuta es backend/sonar-project.properties. Aqui se referencia
# el proyecto para no dejar valores de otros repos.
sonar.projectKey=EasySchedule
sonar.projectName=EasySchedule
sonar.projectVersion=1.0
sonar.host.url=${SONAR_HOST_URL:http://localhost:9000}
sonar.token=${SONAR_TOKEN:}
sonar.sources=src/main/java
sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true